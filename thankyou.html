<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven Seas | Thank You</title>

    <!-- Bootstrap CSS Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Google Fonts: Handlee (headings), Quicksand (sub-headings and buttons) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&family=Quicksand:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Custom CSS Link -->
    <link href="assets/css/styles.css" rel="stylesheet">
</head>


<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="assets/images/seven-seas-logo.png" alt="Seven Seas logo" width="30">
                Seven Seas Spa
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="services.html">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="contact.html"><strong>Contact</strong></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero hero-short d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 hero-content text-center">
                    <h1 class="hero-title mb-3">Thank You</h1>
                    <p class="hero-subtitle mb-0">Your message is on its way to us</p>
                </div>
            </div>
        </div>
    </section>

    <main>

        <!-- Content -->
        <section class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-10 col-lg-8">

                        <!-- Thank-you card -->
                        <div class="card contact-card border-0 shadow">
                            <div class="card-body p-4 p-md-5 text-center">
                                <div class="tip-icon thankyou-icon mb-4">
                                    <i class="fa-solid fa-check" aria-hidden="true"></i>
                                </div>
                                <h2 class="section-title mb-3" id="thankyouHeading">Message Sent</h2>
                                <p class="lead mb-4">Thank you for getting in touch with Seven Seas Spa. A member of our
                                    team will get back to you within 1&ndash;2 working days.</p>
                                <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                                    <a href="index.html" class="btn btn-brand btn-lg px-5">Back to Home</a>
                                    <a href="contact.html" class="btn btn-outline-brand btn-lg px-5">Send Another
                                        Message</a>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer mt-5 py-4">
        <div class="container d-flex flex-column flex-sm-row align-items-center justify-content-between gap-3">
            <p class="mb-0">&copy; <span id="year">2026</span> Seven Seas Spa</p>
            <ul class="social-links list-unstyled d-flex gap-3 mb-0">
                <li><a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook" aria-hidden="true"></i></a></li>
                <li><a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter" aria-hidden="true"></i></a></li>
                <li><a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
                </li>
                <li><a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a></li>
            </ul>
        </div>
    </footer>

    <!-- Keep the copyright year current -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

    <!-- Personalise the heading with the first name from the contact form.
         The form submits with GET, so its fields arrive in the URL (thankyou.html?name=...). -->
    <script>
        const submittedName = new URLSearchParams(window.location.search).get('name');
        if (submittedName && submittedName.trim()) {
            const firstName = submittedName.trim().split(/\s+/)[0];
            document.getElementById('thankyouHeading').textContent = `Thanks, ${firstName}!`;
        }
    </script>

    <!-- Bootstrap JS link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Font Awesome link -->
    <script src="https://kit.fontawesome.com/5ec5e6d1dd.js" crossorigin="anonymous"></script>
</body>

</html>
